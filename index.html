<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Night Shift Pong</title>
  <style>
    :root {
      --bg1: #040b18;
      --bg2: #0d1830;
      --panel: rgba(15, 23, 42, 0.9);
      --line: rgba(148, 163, 184, 0.35);
      --text: #e2e8f0;
      --blue: #7dd3fc;
      --violet: #c084fc;
      --gold: #fbbf24;
      --green: #34d399;
      --red: #f87171;
      --shadow: rgba(125, 211, 252, 0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1d2f56 0%, var(--bg1) 38%, #020712 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      position: relative;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(2, 6, 23, 0.97));
      border: 2px solid var(--line);
      border-radius: 22px;
      padding: 18px 18px 12px;
      box-shadow:
        0 28px 60px rgba(0,0,0,0.5),
        0 0 30px rgba(125, 211, 252, 0.16),
        inset 0 0 25px rgba(125,211,252,0.04);
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 800px;
      max-width: 90vw;
      margin: 0 auto 12px;
      font-size: 2.4rem;
      letter-spacing: 4px;
      font-weight: 800;
      text-shadow: 0 0 16px rgba(125, 211, 252, 0.85);
    }

    .score {
      min-width: 100px;
      text-align: center;
    }

    canvas {
      display: block;
      width: 800px;
      max-width: 90vw;
      height: auto;
      background: linear-gradient(180deg, rgba(11,17,32,1), rgba(7,13,24,1));
      border: 2px solid rgba(148,163,184,0.18);
      border-radius: 14px;
      box-shadow: inset 0 0 18px rgba(125, 211, 252, 0.08);
    }

    .controls {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      color: #022033;
      background: linear-gradient(135deg, var(--blue), #a5f3fc);
      box-shadow: 0 10px 18px rgba(125, 211, 252, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 22px rgba(125, 211, 252, 0.34);
    }

    button.secondary {
      background: linear-gradient(135deg, #c4b5fd, #ddd6fe);
    }

    button.danger {
      background: linear-gradient(135deg, #fca5a5, #fecaca);
    }

    .menu-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(86%, 520px);
      background: rgba(3, 7, 18, 0.76);
      border: 2px solid rgba(125, 211, 252, 0.3);
      border-radius: 18px;
      box-shadow: 0 0 40px rgba(125, 211, 252, 0.12);
      padding: 28px 24px 20px;
      text-align: center;
      backdrop-filter: blur(8px);
    }

    .hidden { display: none !important; }

    .title {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 3px;
      font-weight: 900;
      color: #f8fafc;
      text-shadow: 0 0 22px rgba(125, 211, 252, 0.8);
    }

    .subtitle {
      margin: 0 0 18px;
      color: rgba(226, 232, 240, 0.82);
      font-size: 1rem;
      letter-spacing: 1px;
    }

    .mode-row,
    .difficulty-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .mode-btn,
    .difficulty-btn {
      padding: 10px 16px;
      font-size: 0.95rem;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      box-shadow: none;
    }

    .mode-btn.active,
    .difficulty-btn.active {
      background: linear-gradient(135deg, rgba(125, 211, 252, 0.25), rgba(192, 132, 252, 0.25));
      border-color: rgba(125, 211, 252, 0.75);
      box-shadow: 0 0 18px rgba(125, 211, 252, 0.2);
    }

    .menu-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .instructions {
      margin-top: 18px;
      color: rgba(148, 163, 184, 0.9);
      font-size: 0.94rem;
      line-height: 1.6;
    }

    .instructions strong {
      color: #f8fafc;
    }

    @media (max-width: 720px) {
      .scoreboard {
        font-size: 1.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="scoreboard">
      <div class="score" id="leftScore">0</div>
      <div>:</div>
      <div class="score" id="rightScore">0</div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls">
      <button id="startBtn">Start</button>
      <button id="pauseBtn" class="secondary">Pause</button>
      <button id="restartBtn" class="danger">Restart</button>
    </div>

    <div id="menuOverlay" class="menu-overlay">
      <h1 class="title">Night Shift Pong</h1>
      <p class="subtitle">Neon arcade showdown</p>

      <div class="mode-row">
        <button class="mode-btn active" data-mode="solo">Solo vs AI</button>
        <button class="mode-btn" data-mode="local">Local 2P</button>
      </div>

      <div class="difficulty-row">
        <button class="difficulty-btn active" data-difficulty="easy">Easy</button>
        <button class="difficulty-btn" data-difficulty="normal">Normal</button>
        <button class="difficulty-btn" data-difficulty="hard">Hard</button>
      </div>

      <div class="menu-actions">
        <button id="menuStartBtn">Play</button>
      </div>

      <div class="instructions">
        <strong>Controls:</strong>
        <br>
        Solo: mouse or <strong>Arrow Up</strong> / <strong>Arrow Down</strong> for left paddle.
        <br>
        Local 2P: left uses mouse/Arrow keys, right uses <strong>W</strong> / <strong>S</strong>.
        <br>
        <strong>Pause:</strong> Space or the pause button.
        <br>
        <strong>Goal:</strong> first to 5 points wins.
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const leftScoreEl = document.getElementById("leftScore");
    const rightScoreEl = document.getElementById("rightScore");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const restartBtn = document.getElementById("restartBtn");
    const menuOverlay = document.getElementById("menuOverlay");
    const menuStartBtn = document.getElementById("menuStartBtn");
    const modeButtons = [...document.querySelectorAll(".mode-btn")];
    const difficultyButtons = [...document.querySelectorAll(".difficulty-btn")];

    const settings = {
      mode: "solo",
      difficulty: "easy",
      maxScore: 5
    };

    const difficultyMap = {
      easy: { aiFactor: 0.085, maxBallSpeed: 11.5 },
      normal: { aiFactor: 0.12, maxBallSpeed: 13.5 },
      hard: { aiFactor: 0.16, maxBallSpeed: 15.5 }
    };

    const paddleWidth = 14;
    const paddleHeight = 112;
    const ballRadius = 9;

    const leftPaddle = { x: 22, y: canvas.height / 2 - paddleHeight / 2, speed: 7 };
    const rightPaddle = { x: canvas.width - 22 - paddleWidth, y: canvas.height / 2 - paddleHeight / 2, speed: 5.3 };

    let ball = { x: canvas.width / 2, y: canvas.height / 2, vx: 5.5, vy: 3.5, radius: ballRadius };
    let leftScore = 0;
    let rightScore = 0;
    let gameState = "menu";
    let winnerText = "";
    let lastTime = 0;

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      w: false,
      s: false
    };

    const mouse = { active: false, y: canvas.height / 2 };
    let audioCtx = null;

    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (Ctx) audioCtx = new Ctx();
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playTone(freq, duration, type = "sine", volume = 0.04) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.stop(audioCtx.currentTime + duration);
    }

    function playPaddleSound() {
      playTone(240, 0.05, "square", 0.045);
    }

    function playScoreSound() {
      playTone(170, 0.09, "triangle", 0.05);
      setTimeout(() => playTone(120, 0.1, "triangle", 0.04), 60);
    }

    function playWinSound() {
      playTone(420, 0.1, "sine", 0.07);
      setTimeout(() => playTone(620, 0.18, "triangle", 0.07), 100);
      setTimeout(() => playTone(840, 0.2, "triangle", 0.07), 220);
    }

    modeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        settings.mode = button.dataset.mode;
        modeButtons.forEach((btn) => btn.classList.toggle("active", btn === button));
      });
    });

    difficultyButtons.forEach((button) => {
      button.addEventListener("click", () => {
        settings.difficulty = button.dataset.difficulty;
        difficultyButtons.forEach((btn) => btn.classList.toggle("active", btn === button));
      });
    });

    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();

      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        keys[event.key] = true;
        event.preventDefault();
      }

      if (key === "w") keys.w = true;
      if (key === "s") keys.s = true;

      if (event.code === "Space") {
        event.preventDefault();
        togglePause();
      }
    });

    document.addEventListener("keyup", (event) => {
      const key = event.key.toLowerCase();

      if (event.key === "ArrowUp" || event.key === "ArrowDown") {
        keys[event.key] = false;
      }

      if (key === "w") keys.w = false;
      if (key === "s") keys.s = false;
    });

    canvas.addEventListener("mousemove", (event) => {
      const rect = canvas.getBoundingClientRect();
      const scaleY = canvas.height / rect.height;
      mouse.y = (event.clientY - rect.top) * scaleY;
      mouse.active = true;
    });

    startBtn.addEventListener("click", () => {
      ensureAudio();
      startGame();
    });

    menuStartBtn.addEventListener("click", () => {
      ensureAudio();
      startGame();
    });

    pauseBtn.addEventListener("click", () => {
      ensureAudio();
      togglePause();
    });

    restartBtn.addEventListener("click", () => {
      ensureAudio();
      resetMatch();
      startGame();
    });

    function resetBall(direction = Math.random() < 0.5 ? -1 : 1) {
      ball.x = canvas.width / 2;
      ball.y = canvas.height / 2;

      const angle = (Math.random() * Math.PI / 2) - Math.PI / 4;
      const speed = 6.2 + Math.random() * 0.8;

      ball.vx = Math.cos(angle) * speed * direction;
      ball.vy = Math.sin(angle) * speed;
    }

    function updateLeftPaddle() {
      if (mouse.active) {
        leftPaddle.y = mouse.y - paddleHeight / 2;
      }

      if (keys.ArrowUp) leftPaddle.y -= leftPaddle.speed;
      if (keys.ArrowDown) leftPaddle.y += leftPaddle.speed;

      leftPaddle.y = Math.max(0, Math.min(canvas.height - paddleHeight, leftPaddle.y));
    }

    function updateRightPaddle() {
      if (settings.mode === "solo") {
        const currentDifficulty = difficultyMap[settings.difficulty];
        const target = ball.y - rightPaddle.y - paddleHeight / 2;
        rightPaddle.y += target * currentDifficulty.aiFactor;
      } else {
        if (keys.w) rightPaddle.y -= rightPaddle.speed;
        if (keys.s) rightPaddle.y += rightPaddle.speed;
      }

      rightPaddle.y = Math.max(0, Math.min(canvas.height - paddleHeight, rightPaddle.y));
    }

    function handleWallCollision() {
      if (ball.y - ball.radius <= 0) {
        ball.y = ball.radius;
        ball.vy *= -1;
      }

      if (ball.y + ball.radius >= canvas.height) {
        ball.y = canvas.height - ball.radius;
        ball.vy *= -1;
      }
    }

    function handlePaddleCollision() {
      const leftHit =
        ball.x - ball.radius <= leftPaddle.x + paddleWidth &&
        ball.x - ball.radius >= leftPaddle.x &&
        ball.y >= leftPaddle.y &&
        ball.y <= leftPaddle.y + paddleHeight &&
        ball.vx < 0;

      if (leftHit) {
        const relative = (ball.y - (leftPaddle.y + paddleHeight / 2)) / (paddleHeight / 2);
        const angle = relative * (Math.PI / 3);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.8, difficultyMap[settings.difficulty].maxBallSpeed);

        ball.vx = Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
        ball.x = leftPaddle.x + paddleWidth + ball.radius;
        playPaddleSound();
      }

      const rightHit =
        ball.x + ball.radius >= rightPaddle.x &&
        ball.x + ball.radius <= rightPaddle.x + paddleWidth &&
        ball.y >= rightPaddle.y &&
        ball.y <= rightPaddle.y + paddleHeight &&
        ball.vx > 0;

      if (rightHit) {
        const relative = (ball.y - (rightPaddle.y + paddleHeight / 2)) / (paddleHeight / 2);
        const angle = relative * (Math.PI / 3);
        const speed = Math.min(Math.hypot(ball.vx, ball.vy) + 0.8, difficultyMap[settings.difficulty].maxBallSpeed);

        ball.vx = -Math.cos(angle) * speed;
        ball.vy = Math.sin(angle) * speed;
        ball.x = rightPaddle.x - ball.radius;
        playPaddleSound();
      }
    }

    function checkWinner() {
      if (leftScore >= settings.maxScore || rightScore >= settings.maxScore) {
        winnerText = leftScore >= settings.maxScore ? "Player 1 Wins" : (settings.mode === "solo" ? "Computer Wins" : "Player 2 Wins");
        gameState = "finished";
        pauseBtn.textContent = "Pause";
        menuOverlay.classList.remove("hidden");
        menuOverlay.querySelector(".title").textContent = winnerText;
        menuOverlay.querySelector(".subtitle").textContent = leftScore >= settings.maxScore ? "You took the neon crown." : "A clean victory.";
        menuOverlay.querySelector(".mode-row").classList.add("hidden");
        menuOverlay.querySelector(".difficulty-row").classList.add("hidden");
        menuOverlay.querySelector(".menu-actions").innerHTML = '<button id="menuPlayAgainBtn">Play Again</button>';
        menuOverlay.querySelector(".instructions").innerHTML = '<strong>Rematch?</strong><br>Jump back in and see if the result changes.';
        document.getElementById("menuPlayAgainBtn").addEventListener("click", () => {
          resetMatch();
          startGame();
        });
        playWinSound();
        return true;
      }
      return false;
    }

    function updateScore() {
      if (ball.x + ball.radius < 0) {
        rightScore++;
        rightScoreEl.textContent = rightScore;
        playScoreSound();
        if (!checkWinner()) resetBall(1);
      }

      if (ball.x - ball.radius > canvas.width) {
        leftScore++;
        leftScoreEl.textContent = leftScore;
        playScoreSound();
        if (!checkWinner()) resetBall(-1);
      }
    }

    function startGame() {
      if (gameState === "finished") {
        resetMatch();
      }
      gameState = "playing";
      pauseBtn.textContent = "Pause";
      menuOverlay.classList.add("hidden");
      if (leftScore === 0 && rightScore === 0) {
        resetBall(Math.random() < 0.5 ? -1 : 1);
      }
    }

    function resetMatch() {
      leftScore = 0;
      rightScore = 0;
      leftScoreEl.textContent = "0";
      rightScoreEl.textContent = "0";
      leftPaddle.y = canvas.height / 2 - paddleHeight / 2;
      rightPaddle.y = canvas.height / 2 - paddleHeight / 2;
      resetBall(Math.random() < 0.5 ? -1 : 1);
      gameState = "menu";
      pauseBtn.textContent = "Pause";
      startBtn.textContent = "Start";
      winnerText = "";

      menuOverlay.classList.remove("hidden");
      menuOverlay.querySelector(".title").textContent = "Night Shift Pong";
      menuOverlay.querySelector(".subtitle").textContent = "Neon arcade showdown";
      menuOverlay.querySelector(".mode-row").classList.remove("hidden");
      menuOverlay.querySelector(".difficulty-row").classList.remove("hidden");
      menuOverlay.querySelector(".menu-actions").innerHTML = '<button id="menuStartBtn">Play</button>';
      menuOverlay.querySelector(".instructions").innerHTML = '<strong>Controls:</strong><br>Solo: mouse or <strong>Arrow Up</strong> / <strong>Arrow Down</strong> for left paddle.<br>Local 2P: left uses mouse/Arrow keys, right uses <strong>W</strong> / <strong>S</strong>.<br><strong>Pause:</strong> Space or the pause button.<br><strong>Goal:</strong> first to 5 points wins.';
      document.getElementById("menuStartBtn").addEventListener("click", () => {
        ensureAudio();
        startGame();
      });
    }

    function togglePause() {
      if (gameState === "menu" || gameState === "finished") return;
      gameState = gameState === "paused" ? "playing" : "paused";
      pauseBtn.textContent = gameState === "paused" ? "Resume" : "Pause";
    }

    function update() {
      if (gameState !== "playing") return;

      updateLeftPaddle();
      updateRightPaddle();

      ball.x += ball.vx;
      ball.y += ball.vy;

      handleWallCollision();
      handlePaddleCollision();
      updateScore();
    }

    function drawBackground() {
      ctx.fillStyle = "#071221";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(148,163,184,0.28)";
      ctx.setLineDash([14, 16]);
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      for (let i = 0; i < canvas.height; i += 32) {
        ctx.fillStyle = i % 64 === 0 ? "rgba(125,211,252,0.04)" : "rgba(192,132,252,0.025)";
        ctx.fillRect(0, i, canvas.width, 16);
      }
    }

    function drawPaddle(x, y) {
      ctx.fillStyle = "#f8fafc";
      ctx.shadowColor = "rgba(148, 163, 184, 0.7)";
      ctx.shadowBlur = 15;
      ctx.fillRect(x, y, paddleWidth, paddleHeight);
      ctx.shadowBlur = 0;
    }

    function drawBall() {
      ctx.fillStyle = "#fbbf24";
      ctx.shadowColor = "rgba(251, 191, 36, 0.9)";
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    function drawStateText() {
      ctx.textAlign = "center";

      if (gameState === "menu") {
        ctx.fillStyle = "rgba(226, 232, 240, 0.9)";
        ctx.font = "bold 30px Arial";
        ctx.fillText("Ready?", canvas.width / 2, canvas.height / 2 - 18);
        ctx.font = "18px Arial";
        ctx.fillStyle = "rgba(148, 163, 184, 0.9)";
        ctx.fillText("Mouse + Arrow keys · W/S for 2P · Space to pause", canvas.width / 2, canvas.height / 2 + 18);
      }

      if (gameState === "paused") {
        ctx.fillStyle = "rgba(226, 232, 240, 0.96)";
        ctx.font = "bold 36px Arial";
        ctx.fillText("Paused", canvas.width / 2, canvas.height / 2 - 12);
      }

      if (gameState === "finished") {
        ctx.fillStyle = leftScore >= settings.maxScore ? "#34d399" : "#f87171";
        ctx.font = "bold 38px Arial";
        ctx.fillText(winnerText, canvas.width / 2, canvas.height / 2 - 12);
        ctx.font = "20px Arial";
        ctx.fillStyle = "rgba(226, 232, 240, 0.9)";
        ctx.fillText("Press Play Again to return to the arena", canvas.width / 2, canvas.height / 2 + 22);
      }
    }

    function draw() {
      drawBackground();
      drawPaddle(leftPaddle.x, leftPaddle.y);
      drawPaddle(rightPaddle.x, rightPaddle.y);
      drawBall();
      drawStateText();
    }

    function gameLoop(timestamp) {
      const delta = Math.min(0.03, (timestamp - lastTime) / 1000 || 0.016);
      lastTime = timestamp;

      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    resetMatch();
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
